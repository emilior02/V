<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine?</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2; /* keep this above the side images */
    }

    h1 {
      margin-bottom: 30px;
      color: #e63946;
    }

    button {
      font-size: 18px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background-color: #e63946;
      color: white;
    }

    #no {
      background-color: #adb5bd;
      color: white;
      position: absolute;
      z-index: 3;
    }

    /* --- Side images --- */
    .side-image {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 220px;     /* adjust size */
      opacity: 0.9;
      z-index: 1;
      pointer-events: none; /* so they don't block buttons */
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .left { left: 20px; }
    .right { right: 20px; }

    /* --- Mobile-friendly: hide side images on small screens --- */
    @media (max-width: 768px) {
      .side-image { display: none; }
      .container {
        width: min(90vw, 420px);
        padding: 28px;
      }
      h1 { font-size: 24px; }
    }
  </style>
</head>

<body>
  <!-- Replace left.jpg and right.jpg with your actual uploaded filenames -->
  <img src="left.jpg" class="side-image left" alt="Left image">
  <img src="right.jpg" class="side-image right" alt="Right image">

  <div class="container">
    <h1>Jiwoo, will you be my valentine this year? 💘</h1>
    <button id="yes">Yes 💖</button>
  </div>

  <button id="no">No 😢</button>

  <script>
    const noButton = document.getElementById("no");

    // Place "No" somewhere reasonable on load
    function placeNoInitially() {
      const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
      const y = Math.random() * (window.innerHeight - noButton.offsetHeight);
      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;
    }

    function moveButton() {
      const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
      const y = Math.random() * (window.innerHeight - noButton.offsetHeight);
      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;
    }

    window.addEventListener("load", placeNoInitially);
    window.addEventListener("resize", placeNoInitially);
    noButton.addEventListener("mouseenter", moveButton);

    document.getElementById("yes").addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          font-family:Arial;
          text-align:center;
          padding: 24px;">
          <h1 style="color:#e63946; font-size: 42px; line-height: 1.15;">
            YAYYY 💕🥰<br>
            Best Valentine ever 💘
          </h1>
        </div>
      `;
    });
  </script>
</body>
</html>
